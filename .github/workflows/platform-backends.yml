name: platform-backends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plans/ci-matrix.md"
      - "quarshell-*/**"
      - "go.work"
      - "go.work.sum"
      - "tools/**"
      - "scripts/**"
      - ".github/workflows/platform-backends.yml"

permissions:
  contents: read

jobs:
  linux-kvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Go modules
        run: bash tools/checkout-modules.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and test VM packages
        run: go test -C quarshell-driver-vm ./... -count=1
      - name: Checkout pinned OpenShell runtime build inputs
        run: |
          source_dir="$RUNNER_TEMP/openshell-v0.1.4"
          git clone --depth 1 --branch v0.1.4 https://github.com/NVIDIA/OpenShell.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "5a7728c304b5528e954e9ae900cf21f84e1a12b1"
      - name: Install pinned Rust toolchain for libkrun
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build OpenShell-pinned libkrun runtime
        run: bash "$RUNNER_TEMP/openshell-v0.1.4/tasks/scripts/vm/build-libkrun.sh"
      - name: Stage source-pinned runtime digest lock
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/quarshell-vm-runtime"
          lock_path="$RUNNER_TEMP/quarshell-vm-runtime-trust.json"
          mkdir -p "$runtime_dir"
          build_dir="$RUNNER_TEMP/openshell-v0.1.4/target/libkrun-build"
          cp "$build_dir/libkrun.so" "$runtime_dir/libkrun.so"
          libkrunfw_path=$(find "$build_dir" -maxdepth 1 -type f -name 'libkrunfw.so.5*' -print -quit)
          test -n "$libkrunfw_path"
          cp "$libkrunfw_path" "$runtime_dir/libkrunfw.so.5"
          chmod 0600 "$runtime_dir/libkrun.so" "$runtime_dir/libkrunfw.so.5"
          python3 - "$runtime_dir" "$lock_path" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          runtime = Path(sys.argv[1])
          lock = Path(sys.argv[2])
          names = ("libkrun.so", "libkrunfw.so.5")
          payload = {
              "schema_version": 1,
              "host": "linux/amd64",
              "artifacts": {
                  name: hashlib.sha256((runtime / name).read_bytes()).hexdigest()
                  for name in names
              },
          }
          lock.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          lock.chmod(0o600)
          PY
          echo "OPENSHELL_VM_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "QUARSHELL_VM_RUNTIME_TRUST_LOCK=$lock_path" >> "$GITHUB_ENV"
      - name: Check hosted KVM access
        id: kvm
        shell: bash
        run: |
          if [ -c /dev/kvm ] && [ "$(id -u)" -ne 0 ]; then
            # GitHub-hosted runners expose /dev/kvm as root:kvm, but the
            # ephemeral runner account is not consistently in the kvm group.
            # Grant this job's primary group access on its disposable runner.
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod 0660 /dev/kvm
          fi
          kvm_device=false
          runtime_available=false
          trust_lock_available=false
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ] && [ "$(id -u)" -ne 0 ]; then
            kvm_device=true
          fi
          if { [ -n "${OPENSHELL_VM_RUNTIME_DIR:-}" ] && [ -s "$OPENSHELL_VM_RUNTIME_DIR/libkrun.so" ] && [ -s "$OPENSHELL_VM_RUNTIME_DIR/libkrunfw.so.5" ]; } || { ldconfig -p 2>/dev/null | grep -q 'libkrun\.so' && ldconfig -p 2>/dev/null | grep -q 'libkrunfw\.so\.5'; }; then
            runtime_available=true
          fi
          if [ -n "${QUARSHELL_VM_RUNTIME_TRUST_LOCK:-}" ] && [ -s "$QUARSHELL_VM_RUNTIME_TRUST_LOCK" ]; then
            trust_lock_available=true
          fi
          echo "kvm_device=$kvm_device" >> "$GITHUB_OUTPUT"
          echo "runtime_available=$runtime_available" >> "$GITHUB_OUTPUT"
          echo "trust_lock_available=$trust_lock_available" >> "$GITHUB_OUTPUT"
          ls -l /dev/kvm 2>/dev/null || true
          if [ "$kvm_device" = true ] && [ "$runtime_available" = true ] && [ "$trust_lock_available" = true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$kvm_device" != true ]; then
              echo "::warning::GitHub-hosted ubuntu-24.04 has no usable non-root /dev/kvm; live KVM acceptance remains unverified"
            elif [ "$runtime_available" != true ]; then
              echo "::warning::GitHub-hosted ubuntu-24.04 exposes /dev/kvm, but no compatible libkrun runtime bundle is configured; live KVM acceptance remains unverified"
            else
              echo "::warning::GitHub-hosted ubuntu-24.04 exposes /dev/kvm and libkrun, but no approved runtime digest lock is configured; live KVM acceptance remains unverified"
            fi
          fi
      - name: Make hosted runner root mount private for VM worker isolation
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo mount --make-rprivate /
          propagation="$(findmnt -n -o PROPAGATION /)"
          echo "runner root mount propagation: $propagation"
          test "$propagation" = private
      - name: Run live KVM lifecycle acceptance
        if: steps.kvm.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          go_root=$(go env GOROOT)
          go_path=$(go env GOPATH)
          task_bin=$(command -v task)
          rootfs_tar="$RUNNER_TEMP/quarshell-kvm-alpine-rootfs.tar"
          rootfs_container=$(docker run -d --platform linux/amd64 \
            docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            /bin/sh -c 'while :; do sleep 3600; done')
          docker exec "$rootfs_container" adduser -D -u 1000 sandbox
          docker export --output "$rootfs_tar" "$rootfs_container"
          docker rm -f "$rootfs_container" >/dev/null

          # GitHub-hosted Linux runners expose KVM but restrict mount operations
          # in the job's outer user namespace. Run the actual acceptance in a
          # disposable privileged container, then drop to the runner's numeric
          # identity before starting the application worker. The worker still
          # has to create and validate its own user+mount namespaces as non-root.
          docker run --rm --privileged --device=/dev/kvm --security-opt seccomp=unconfined \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$OPENSHELL_VM_RUNTIME_DIR:$OPENSHELL_VM_RUNTIME_DIR:ro" \
            --volume "$QUARSHELL_VM_RUNTIME_TRUST_LOCK:$QUARSHELL_VM_RUNTIME_TRUST_LOCK:ro" \
            --volume "$rootfs_tar:$rootfs_tar:ro" \
            --volume "$go_root:/opt/go:ro" \
            --volume "$go_path:/go" \
            --volume "$task_bin:/usr/local/bin/task:ro" \
            --workdir /workspace \
            --env RUNNER_UID="$runner_uid" \
            --env RUNNER_GID="$runner_gid" \
            --env OPENSHELL_VM_RUNTIME_DIR \
            --env QUARSHELL_VM_RUNTIME_TRUST_LOCK \
            --env QUARSHELL_VM_TEST_ROOTFS_TAR="$rootfs_tar" \
            ubuntu:24.04 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates curl e2fsprogs libcap-ng0 libdrm2 libegl1 \
                libepoxy0 libgbm1 libgl1 libseccomp2 libvirglrenderer1 python3
              if ! getent group "$RUNNER_GID" >/dev/null; then
                groupadd --gid "$RUNNER_GID" runner
              fi
              runner_group=$(getent group "$RUNNER_GID" | cut -d: -f1)
              useradd --uid "$RUNNER_UID" --gid "$runner_group" --home-dir /tmp/runner-home \
                --create-home --shell /bin/bash runner
              chown "$RUNNER_UID:$RUNNER_GID" /tmp/runner-home
              setpriv --reuid "$RUNNER_UID" --regid "$runner_group" --init-groups -- \
                env HOME=/tmp/runner-home GOROOT=/opt/go GOPATH=/go \
                PATH=/opt/go/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
                bash -euc "go test -C quarshell-driver-vm ./vm -v -run \"^TestWorkerIsolationNamespaceSubprocess\$\" -count=1 && task vm:live-linux"
            '

  macos-hvf:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Go modules
        run: bash tools/checkout-modules.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Build and test VM packages
        run: go test -C quarshell-driver-vm ./... -count=1
      - name: Check hosted Hypervisor.framework access
        id: hvf
        shell: bash
        run: |
          support="$(sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          echo "kern.hv_support=$support"
          if [ "$support" = 1 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub-hosted macos-14 does not expose Hypervisor.framework; live HVF acceptance remains unverified"
          fi
      - name: Install live VM prerequisites
        if: steps.hvf.outputs.available == 'true'
        run: brew install libkrun libkrunfw e2fsprogs
      - name: Run live HVF lifecycle acceptance
        if: steps.hvf.outputs.available == 'true'
        run: quarshell-driver/scripts/run-live-darwin-arm64-acceptance.sh

  windows-mxc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Go modules
        shell: bash
        run: bash tools/checkout-modules.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Check MXC SDK availability
        shell: pwsh
        run: |
          $build = [Environment]::OSVersion.Version.Build
          $wxc = if ($env:OPENSHELL_WXC_EXEC_PATH) { $env:OPENSHELL_WXC_EXEC_PATH } else { 'C:\mxc\wxc-exec.exe' }
          $app = Join-Path (Split-Path $wxc -Parent) 'IsoSessionApp.dll'
          Write-Output "Windows build: $build (MXC requires >= 26300)"
          Write-Output "wxc-exec: $wxc"
          Write-Output "IsoSessionApp.dll: $app"
          if ($build -lt 26300 -or !(Test-Path $wxc) -or !(Test-Path $app)) {
            Write-Output "::warning::GitHub-hosted Windows runner lacks the required Windows 11 Insider build and/or MXC runtime; native MXC acceptance remains unverified"
          }
      - name: Build driver and VM module for Windows
        shell: pwsh
        run: |
          go build -C quarshell-driver ./...
          go build -C quarshell-driver-vm ./...
          go test -C quarshell-driver-vm ./vm -run '^TestVMBackendRegistersFromItsOwnModule$' -count=1
      - name: Run Windows-compatible driver package tests
        shell: pwsh
        run: >-
          go test -C quarshell-driver
          ./driver ./internal/backendcontract ./internal/docker
          ./internal/kubernetes ./internal/mounts ./podman
          ./internal/sidecar ./tests/e2e ./tests/e2e/docker -count=1
